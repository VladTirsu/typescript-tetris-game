
name: Build and Test Vector Blocks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Game
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:ci

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vector-blocks-test-results
          path: test-results/
          if-no-files-found: warn

      - name: Build game
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vector-blocks-build
          path: dist/
          if-no-files-found: error
